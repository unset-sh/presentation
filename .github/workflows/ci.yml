name: ci

# Calls tooling's shared check, the single source of truth for how organisation repositories run CI.
# Pinned to a full tooling commit; docs/use-workflows.md in unset-sh/tooling describes the inputs.

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build, tests and gallery
    uses: unset-sh/tooling/.github/workflows/ci-check.yml@3fe3db56a710da477877f1e1e3fe37abf4d3b71c
    permissions:
      contents: read
      packages: read # the install step reads @unset-sh/brand from GitHub Packages
    with:
      install: true
      # The gallery is drawn even when the check fails, so its pictures show what broke; the job still fails.
      command: |
        status=0
        bun run check || status=$?
        bun run gallery || status=1
        exit "$status"
      keep: gallery/out/
