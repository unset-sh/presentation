name: release

# A release starts when a raised version in package.json lands on main. Tooling's shared release checks and
# builds once, waits for approval on the `release` environment, then attests, publishes that same file to
# GitHub Packages and tags v<version>. docs/release-reference.md in unset-sh/tooling describes it.

on:
  push:
    branches: [main]
    paths: [package.json]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: unset-sh/tooling/.github/workflows/releases-package.yml@3fe3db56a710da477877f1e1e3fe37abf4d3b71c
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    with:
      install: true
      npm-package: true
